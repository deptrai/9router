# ============================================================================
# 9Router E-Commerce Platform — Production Docker Compose Configuration
# Orchestrates PostgreSQL, Redis, API Server, Sourcing Worker, Admin, and Mini-App
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Database: PostgreSQL 16
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: 9router-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-9router_ecommerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-9router_ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - 9router-internal

  # --------------------------------------------------------------------------
  # Cache & Queue Broker: Redis 7.2
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: 9router-prod-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - 9router-internal

  # --------------------------------------------------------------------------
  # Telegram Relay Service: Single-Session MTProto Relay (Story 6.1)
  # --------------------------------------------------------------------------
  telegram-relay:
    build:
      context: .
      dockerfile: docker/Dockerfile.telegram-relay
    container_name: 9router-prod-telegram-relay
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: 3800
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION}
      RELAY_POLL_MS: ${RELAY_POLL_MS:-3000}
    expose:
      - "3800"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3800/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - 9router-internal

  # --------------------------------------------------------------------------
  # Backend API Server: NestJS
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: 9router-prod-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3201
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-9router_ecommerce}
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      STORE_ENC_KEY: ${STORE_ENC_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_SECRET: ${TELEGRAM_BOT_SECRET}
      TELEGRAM_SCRAPER_RELAY_URL: ${TELEGRAM_SCRAPER_RELAY_URL:-http://telegram-relay:3800/relay}
      TELEGRAM_SCRAPER_RELAY_TOKEN: ${RELAY_AUTH_TOKEN:-}
      VIETQR_CLIENT_ID: ${VIETQR_CLIENT_ID:-}
      VIETQR_API_KEY: ${VIETQR_API_KEY:-}
      BITCART_API_URL: ${BITCART_API_URL:-}
      BITCART_API_KEY: ${BITCART_API_KEY:-}
      BITCART_MERCHANT_ID: ${BITCART_MERCHANT_ID:-}
    ports:
      - "${API_PORT:-3201}:3201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 9router-internal
      - 9router-public

  # --------------------------------------------------------------------------
  # Asynchronous Scraper Worker: BullMQ Worker (worker:prod)
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: 9router-prod-worker
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-9router_ecommerce}
      REDIS_URL: redis://redis:6379
      STORE_ENC_KEY: ${STORE_ENC_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_SCRAPER_RELAY_URL: ${TELEGRAM_SCRAPER_RELAY_URL:-http://telegram-relay:3800/relay}
      TELEGRAM_SCRAPER_RELAY_TOKEN: ${RELAY_AUTH_TOKEN:-}
      SOURCING_PURCHASE_TIMEOUT_MS: ${SOURCING_PURCHASE_TIMEOUT_MS:-45000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 9router-internal

  # --------------------------------------------------------------------------
  # Admin Portal: Next.js Standalone
  # --------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: 9router-prod-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3200
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3201}
    ports:
      - "${ADMIN_PORT:-3200}:3200"
    depends_on:
      - api
    networks:
      - 9router-internal
      - 9router-public

  # --------------------------------------------------------------------------
  # Telegram Mini App: Next.js Standalone
  # --------------------------------------------------------------------------
  mini-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.mini-app
    container_name: 9router-prod-mini-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3201}
    ports:
      - "${MINI_APP_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - 9router-internal
      - 9router-public

networks:
  9router-internal:
    driver: bridge
  9router-public:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
